anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: allure-framework/allure-python
      use_max_tag: true
      include_regex: ^\d+\.\d+\.\d+$
      exclude_regex: (?i)^(?=.*(?:(?<=\d)rc\d*|(?<=\d)dev\d+|(?:^|[-._])(?:alpha|beta|gamma|pre|preview)(?:\d+)?|[-._]rc\d+|(?:^|[-._])dev\d+|(?:\d+\.)+\d+[ab]\d*)).+$
      from_pattern: ^v?(\d+(?:\.\d+)*.*)$
      to_pattern: \1
    packages:
      - allure-python-commons
      - allure-python-commons-test
      - allure-behave
      - allure-nose2
      - allure-pytest
      - allure-pytest-bdd
      - allure-robotframework
