{% set name = "allure-python" %}
{% set version = "2.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/allure-framework/{{ name }}/archive/{{ version }}.tar.gz
  sha256: dbb09874b9499d5db032e8cc85a7a139195dcbfd39994c5de077927ad552b86b

build:
  number: 0
  skip: true  # [py<38]

outputs:
  - name: allure-python-commons
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip !=25.1
        - python
        - setuptools
        - wheel
        - setuptools-scm
      run:
        - python
        - attrs >=16.0.0
        - pluggy >=0.4.0
    test:
      imports:
        - allure
        - allure_commons
      commands:
        - pip check
      requires:
        - pip !=25.1

  - name: allure-python-commons-test
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip !=25.1
        - python
        - setuptools
        - wheel
        - setuptools-scm
      run:
        - python
        - pyhamcrest >=1.9.0
    test:
      imports:
        - allure_commons_test
      commands:
        - pip check
      requires:
        - pip !=25.1

  - name: allure-behave
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip
        - python
        - setuptools
        - wheel
        - setuptools-scm <10
      run:
        - python
        - behave >=1.2.5
        - {{ pin_subpackage('allure-python-commons', exact=True) }}
    test:
      source_files:
        - allure-behave/examples/*
        - tests/conftest.py
        - tests/e2e.py
        - tests/__init__.py
        - tests/allure_behave
      imports:
        - allure_behave
      commands:
        - pip check
        - pytest -v tests/allure_behave
      requires:
        - pip !=25.1
        - {{ pin_subpackage('allure-python-commons-test', exact=True) }}
        - pytest
        - docutils
        - mock
        - packaging
        - pyhamcrest
        - pygments

  - name: allure-nose2
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip
        - python
        - setuptools
        - wheel
        - setuptools-scm <10
      run:
        - python
        - nose2
        - {{ pin_subpackage('allure-python-commons', exact=True) }}
    test:
      source_files:
        - tests/conftest.py
        - tests/e2e.py
        - tests/__init__.py
        - tests/allure_nose2
      imports:
        - allure_nose2
      commands:
        - pip check
        - pytest -v tests/allure_nose2
      requires:
        - pip !=25.1
        - {{ pin_subpackage('allure-python-commons-test', exact=True) }}
        - pytest
        - docutils
        - mock
        - packaging
        - pyhamcrest
        - pygments

  - name: allure-pytest
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip
        - python
        # allure-pytest requires pkg_resources from setuptools <82,
        # see https://github.com/allure-framework/allure-python/blob/2.15.3/allure-pytest/setup.py#L3
        - setuptools <82
        - wheel
        - setuptools-scm <10
      run:
        - python
        - pytest >=4.5.0
        - {{ pin_subpackage('allure-python-commons', exact=True) }}
    test:
      source_files:
        - allure-pytest/examples/*
        - tests/conftest.py
        - tests/e2e.py
        - tests/__init__.py
        - tests/allure_pytest
      imports:
        - allure_pytest
      commands:
        - pip check
        # ImportError: Error importing plugin "check": No module named 'check'
        # Needs pytest-check, which is not available in the main channel.
        - pytest -v -k "not (test_pytest_check or test_pytest_flakes)" tests/allure_pytest  # [not win]
        # AssertionError: Expected greater 1745831725925, but 1745831725859.
        - pytest -v --ignore=tests/allure_pytest/acceptance/duration/duration_time_test.py -k "not (test_pytest_check or test_pytest_flakes)" tests/allure_pytest  # [win]
      requires:
        - pip !=25.1
        - {{ pin_subpackage('allure-python-commons-test', exact=True) }}
        - pytest
        - pytest-xdist
        - pytest-rerunfailures
        #- pytest-flakes
        - docutils
        - mock
        - packaging
        - pyhamcrest
        - pygments

  - name: allure-pytest-bdd
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip !=25.1
        - python
        - setuptools
        - wheel
        - setuptools-scm <10
      run:
        - python
        - pytest >=4.5.0
        - pytest-bdd >=5.0.0
        - {{ pin_subpackage('allure-python-commons', exact=True) }}
    test:
      source_files:
        - tests/conftest.py
        - tests/e2e.py
        - tests/__init__.py
        - tests/allure_pytest_bdd
        - tests/allure_pytest
      imports:
        - allure_pytest_bdd
      commands:
        - pip check
        - pytest -v tests/allure_pytest_bdd --clean-alluredir
      requires:
        - pip !=25.1
        - {{ pin_subpackage('allure-python-commons-test', exact=True) }}
        - pytest <8.0
        - pytest-bdd <8.0.0  # [py<314]
        - pytest-bdd >=8.0.0  # [py>=314]
        - docutils
        - mock
        - packaging
        - pyhamcrest
        - pygments

  - name: allure-robotframework
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      host:
        - pip !=25.1
        - python
        - setuptools
        - wheel
        - setuptools-scm <10
      run:
        - python
        - robotframework
        - {{ pin_subpackage('allure-python-commons', exact=True) }}
    test:
      source_files:
        - allure-robotframework/examples/*
        - tests/conftest.py
        - tests/e2e.py
        - tests/__init__.py
        - tests/allure_robotframework
      imports:
        - AllureLibrary
        - allure_robotframework
      commands:
        - pip check
        # Test expects statusDetails on parent steps when a nested keyword fails; 2.15.3 reports statusDetails only on the failed leaf step (parents get {})
        # This is an upstream acceptance-test mismatch with the new listener behavior, not a packaging install failure.
        - pytest -v tests/allure_robotframework -k "not test_only_failed_steps_have_status_details"
      requires:
        - pip !=25.1
        - {{ pin_subpackage('allure-python-commons-test', exact=True) }}
        - pytest
        - docutils
        - mock
        - packaging
        - pyhamcrest
        - pygments

about:
  home: https://github.com/allure-framework/allure-python
  dev_url: https://github.com/allure-framework/allure-python
  license: Apache-2.0
  license_file: LICENSE
  license_family: APACHE
  summary: Allure integrations for Python test frameworks
  description: |
    Allure Framework is a flexible lightweight multi-language test report tool that not only shows a very concise representation of what have been tested in a neat web report form, but allows everyone participating in the development process to extract maximum of useful information from everyday execution of tests.
  doc_url: https://allurereport.org/docs/

extra:
  recipe-maintainers:
    - kenodegard
    - nsoranzo
  skip-lints:
    - missing_test_requirement_pip
